<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeAuth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f7f6f3;
    color: #171512;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: #f7f6f3;
    border: 1px solid rgba(23, 21, 18, 0.14);
    padding: 56px 44px;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .brand .dot {
    width: 10px; height: 10px; background: #a05b0c; flex: none;
    transform: rotate(45deg); border-radius: 0;
  }
  .brand h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; }
  .sub { font-size: 10px; color: #6e675f; text-transform: uppercase; letter-spacing: 0.18em; margin-bottom: 44px; }
  label { display: block; font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #6e675f; margin-bottom: 10px; }
  input#code {
    width: 100%;
    font-size: 32px;
    font-weight: 300;
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    text-align: center;
    padding: 14px 0;
    border: none;
    border-bottom: 1px solid rgba(23, 21, 18, 0.35);
    border-radius: 0;
    outline: none;
    background: transparent;
    font-variant-numeric: tabular-nums;
    color: #171512;
    transition: border-color 0.14s ease;
  }
  .code-wrap { position: relative; }
  input#code:focus { border-bottom-color: #a05b0c; }
  .code-toggle {
    position: absolute;
    right: 0;
    bottom: 12px;
    background: none;
    border: none;
    margin: 0;
    padding: 4px 2px 4px 10px;
    width: auto;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #6e675f;
    cursor: pointer;
    transition: color 0.14s ease;
  }
  .code-toggle:hover { background: none; color: #a05b0c; }
  button {
    width: 100%;
    margin-top: 32px;
    padding: 14px 0;
    background: #171512;
    color: #f7f6f3;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    border: 1px solid #171512;
    border-radius: 0;
    cursor: pointer;
    transition: background 0.14s ease, color 0.14s ease;
  }
  button:hover { background: #a05b0c; border-color: #a05b0c; }
  button:disabled { opacity: .4; cursor: wait; }
  .error { display: none; margin-top: 16px; font-size: 12px; color: #dc2626; font-weight: 500; }
  .error.show { display: block; }
  .setup {
    display: none;
    margin-top: 28px;
    border-top: 1px solid rgba(23, 21, 18, 0.14);
    padding-top: 22px;
  }
  .setup.show { display: block; }
  .setup h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: #6e675f; margin-bottom: 14px; }
  .setup ol { margin: 0 0 14px 18px; font-size: 13px; line-height: 1.9; color: #3d3832; }
  .setup code {
    display: block;
    word-break: break-all;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    background: #efede7;
    border: 1px solid rgba(23, 21, 18, 0.1);
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .setup a { color: #a05b0c; font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
  .foot { margin-top: 36px; font-size: 9px; color: #a8a29e; letter-spacing: 0.2em; text-align: center; text-transform: uppercase; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="dot"></span><h1>HomeAuth</h1></div>
  <div class="sub">Single Sign-On</div>

  <label for="code">Authenticator Code</label>
  <div class="code-wrap">
    <input id="code" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code"
           maxlength="6" placeholder="·····" autofocus>
    <button type="button" class="code-toggle" id="toggle" aria-label="显示验证码" aria-pressed="false">显示</button>
  </div>
  <div class="error" id="error"></div>
  <button id="btn" type="button">Login</button>

  <div class="setup" id="setup">
    <h2>首次使用 · 绑定身份验证器</h2>
    <ol>
      <li>复制下方密钥，或点击 otpauth 链接添加</li>
      <li>在 Google Authenticator / Authy / 1Password 中新建条目</li>
      <li>回到本页输入 6 位动态码完成登录</li>
    </ol>
    <code id="secret">…</code>
    <a id="uri" href="#" target="_blank" rel="noopener">添加 otpauth:// 条目</a>
  </div>

  <div class="foot">HOME AUTH</div>
</div>
<script src="/config.js"></script>
<script>
// 回跳白名单：只允许本站相对路径 / 同源绝对地址，或部署期经 /config.js 注入的域名根及其子域。
// 域名根来自环境变量 ALLOWED_REDIRECT_ROOTS（window.__AUTH_CONFIG__.allowedRedirectRoots），
// 源码不写死任何真实域名；未配置时白名单为空，只允许同源回跳。
// 没有这道闸时，?redirect=https://任意域名 会在登录后把真实的 SSO 会话 token 拼在 URL 上送出去（开放重定向 + token 外泄）。
function allowedRedirectRoots() {
  var cfg = (typeof window !== 'undefined' && window.__AUTH_CONFIG__) || {};
  return Array.isArray(cfg.allowedRedirectRoots) ? cfg.allowedRedirectRoots : [];
}
function isAllowedRedirect(u) {
  if (typeof u !== 'string' || !u) return false;
  if (u.charAt(0) === '/') return u.charAt(1) !== '/' && u.charAt(1) !== '\\'; // 相对路径；拒绝 //evil.com 协议相对
  var p;
  try { p = new URL(u); } catch (e) { return false; }
  if (p.protocol !== 'https:' && p.protocol !== 'http:') return false;
  var h = p.hostname.toLowerCase();
  if (p.origin === location.origin) return true; // 同源：无需配置，默认即可用
  if (h === 'localhost' || h === '127.0.0.1' || h === '[::1]') return true; // 本机调试
  var roots = allowedRedirectRoots();
  for (var i = 0; i < roots.length; i++) {
    var root = String(roots[i] || '').toLowerCase();
    if (root && (h === root || h.slice(-(root.length + 1)) === '.' + root)) return true; // 根域本身或其子域
  }
  return false;
}
var REDIRECT_REJECTED = false;
var REDIRECT = (function () {
  var raw = new URLSearchParams(location.search).get('redirect');
  raw = typeof raw === 'string' && raw ? raw : '/';
  if (!raw.startsWith('/') && !/^https?:\/\//i.test(raw)) return '/';
  if (!isAllowedRedirect(raw)) { REDIRECT_REJECTED = true; return '/'; }

  var url;
  try {
    url = /^https?:\/\//i.test(raw)
      ? new URL(raw)
      : new URL(raw, 'http://placeholder.invalid');
  } catch (e) {
    return '/';
  }

  var pathname = url.pathname;
  if (!pathname.endsWith('/') && !/\.[^/]+$/.test(pathname)) {
    url.pathname = pathname + '/';
  }

  return raw.startsWith('/')
    ? url.pathname + url.search + url.hash
    : url.href;
})();
var form = document.querySelector('.card');
var code = document.getElementById('code');
var btn = document.getElementById('btn');
var error = document.getElementById('error');
var setup = document.getElementById('setup');
var toggle = document.getElementById('toggle');

// 验证码默认掩码显示，点「显示 / 隐藏」手动切换（防止旁人瞄到 / 录屏泄露）
toggle.addEventListener('click', function () {
  var shown = code.type === 'text';
  code.type = shown ? 'password' : 'text';
  toggle.textContent = shown ? '显示' : '隐藏';
  toggle.setAttribute('aria-label', shown ? '显示验证码' : '隐藏验证码');
  toggle.setAttribute('aria-pressed', shown ? 'false' : 'true');
  code.focus();
});

function showError(msg) { error.textContent = msg; error.classList.add('show'); }
function hideError() { error.classList.remove('show'); }

// 回跳用 URL query（?token=，OAuth2 风格）：fragment 经 nginx 301 重定向会被丢弃，query 不会
function redirectWithToken(token) {
  var sep = REDIRECT.indexOf('?') === -1 ? '?' : '&';
  window.location.href = REDIRECT + sep + 'token=' + encodeURIComponent(token);
}

btn.addEventListener('click', login);
code.addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });

// 从 User-Agent 推导设备名（浏览器 · 系统），与后端 deviceNameFromUA 同一套规则
function deviceName() {
  var ua = navigator.userAgent || '';
  var name = [];
  var m;
  if ((m = /Edg\/([\d.]+)/.exec(ua))) name.push('Edge ' + m[1]);
  else if (/OPR\//.test(ua) || /Opera/.test(ua)) name.push('Opera');
  else if ((m = /Firefox\/([\d.]+)/.exec(ua))) name.push('Firefox ' + m[1]);
  else if (/SamsungBrowser\//.test(ua)) name.push('Samsung Browser');
  else if (/MicroMessenger\//.test(ua)) name.push('WeChat');
  else if ((m = /CriOS\/([\d.]+)/.exec(ua))) name.push('Chrome ' + m[1]);
  else if ((m = /Chrome\/([\d.]+)/.exec(ua))) name.push('Chrome ' + m[1]);
  else if (/Safari\//.test(ua)) name.push('Safari');
  if (/Windows NT/.test(ua)) name.push('Windows');
  else if (/iPhone|iPad|iPod/.test(ua)) name.push('iOS');
  else if (/Mac OS X/.test(ua)) name.push('macOS');
  else if (/Android/.test(ua)) name.push('Android');
  else if (/CrOS/.test(ua)) name.push('ChromeOS');
  else if (/Linux/.test(ua)) name.push('Linux');
  return name.join(' · ').slice(0, 64);
}

function login() {
  var value = code.value.replace(/\s/g, '');
  if (!/^\d{6}$/.test(value)) { showError('请输入 6 位数字验证码'); return; }
  hideError();
  btn.disabled = true;
  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: value, deviceName: deviceName() })
  }).then(function (res) {
    return res.json().catch(function () { return {}; }).then(function (data) {
      return { status: res.status, data: data };
    });
  }).then(function (r) {
    if (r.data && r.data.token) { redirectWithToken(r.data.token); return; }
    if (r.status === 403 && r.data && r.data.code === 'totp_setup_required') {
      showError('首次使用：请先完成下方绑定，再输入动态码');
      return setupInit();
    }
    if (r.status === 429) {
      showError('尝试次数过多，请 ' + (r.data.retryAfter || 60) + ' 秒后重试');
      return;
    }
    showError('验证码错误，请重试');
  }).catch(function () {
    showError('网络错误，请重试');
  }).finally(function () {
    btn.disabled = false;
    code.value = '';
    code.focus();
  });
}

function setupInit() {
  return fetch('/api/totp/setup', { method: 'POST' }).then(function (res) {
    return res.json();
  }).then(function (data) {
    if (!data.secret) { showError('初始化失败：' + (data.message || '未知错误')); return; }
    document.getElementById('secret').textContent = data.secret;
    document.getElementById('uri').href = data.otpauthUri;
    document.getElementById('uri').textContent = data.otpauthUri;
    setup.classList.add('show');
  }).catch(function () {
    showError('初始化失败，请刷新重试');
  });
}

code.focus();
if (REDIRECT_REJECTED) showError('回跳地址不在允许范围内，登录后将留在本站');
</script>
</body>
</html>
